<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="app-version" content="20260918-tontrips-monthbottom">
<title>🚚 車趟日報｜每日使用版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
header{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:14px 16px calc(14px + env(safe-area-inset-top));box-shadow:0 2px 10px #0002}
h1{font-size:20px;margin:0 0 10px}.tabs{display:flex;gap:7px}.tabs button{flex:1;border:0;border-radius:10px;padding:10px 4px;background:#374151;color:#fff;font-weight:700}.tabs button.active{background:#fff;color:#111827}
main{max-width:760px;margin:auto;padding:14px 12px 40px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 5px #00000012}
h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;font-weight:700;color:#4b5563}input,select{width:100%;margin-top:5px;border:1px solid #d1d5db;border-radius:10px;padding:11px;font-size:16px;background:#fff}
.full{grid-column:1/-1}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:#f9fafb;border-radius:12px;padding:11px}.metric b{display:block;font-size:20px;margin-top:3px}.metric span{font-size:12px;color:#6b7280}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px;min-width:650px}.table th,.table td{padding:9px 7px;border-bottom:1px solid #e5e7eb;text-align:right}.table th:first-child,.table td:first-child,.table th:nth-child(3),.table td:nth-child(3){text-align:left}.table th{background:#f9fafb}
.item{border:1px solid #e5e7eb;border-radius:13px;padding:11px;margin-top:9px}.itemtop{display:flex;justify-content:space-between;gap:8px}.muted{color:#6b7280;font-size:13px}.profit{font-weight:800}.empty{text-align:center;color:#6b7280;padding:25px 8px}
.note{font-size:12px;color:#6b7280;line-height:1.6}.hidden{display:none!important}
@media(min-width:600px){.summary{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
<h1>🚚 🚚 車趟日報｜每日使用版</h1>
<div class="tabs">
<button data-tab="daily" class="active">每日輸入</button>
<button data-tab="monthly">每月統計</button>
<button data-tab="yearly">年度統計</button>
</div>
</header>
<main>
<section id="daily">
<div class="card">
<h2>新增每日紀錄</h2>
<div class="grid">
<label>日期<input id="date" type="date"></label>
<label class="full">地點<input id="place" type="text" placeholder="例如 台北港"></label>
<label>噸數<input id="tons" type="number" min="0" step="0.01" placeholder="例如 23"></label>
<label>噸車趟<input id="tonTrips" type="number" min="0" step="1" value="0"></label>
<label>每車趟<input id="trips" type="number" min="0" step="1" value="1"></label>
<label>每噸單價<input id="unitPrice" type="number" min="0" step="1" placeholder="例如 150"></label>
<label>每車趟單價<input id="tripPrice" type="number" min="0" step="1" placeholder="例如 3000"></label>
<label class="full">運費總金額％<input id="amountPercent" type="number" min="0" step="0.01" placeholder="例如 10"></label>
<label>支出項目<input id="expenseItem" type="text" placeholder="例如 油錢"></label>
<label>支出金額<input id="expense" type="number" min="0" step="1" placeholder="1500"></label>
<label>收入項目<input id="incomeItem" type="text" placeholder="例如 其他收入"></label>
<label>收入金額<input id="manualIncome" type="number" min="0" step="1" placeholder="1500"></label>
</div>
<p class="note">金額會自動計算：<b>噸數金額＝每噸單價 × 總噸數</b>，<b>車趟金額＝每車趟單價 × 車趟</b>；運費總金額＝噸數金額＋車趟金額。可輸入運費總金額％，系統會自動計算百分比金額。支出與收入僅供自行記錄項目與金額，不參與自動加減。</p>
<div class="row"><button class="btn primary" id="save">＋ 新增紀錄</button><button class="btn secondary" id="clear">清空</button></div><div class="row" style="margin-top:8px"><button class="btn secondary" id="prevDay">← 前一天</button><button class="btn secondary" id="todayBtn">今天</button><button class="btn secondary" id="nextDay">後一天 →</button></div>
</div>

<div class="card"><h2 id="dailyTitle">今日統計</h2><div class="summary" id="dailySummary"></div>
<div class="row" style="margin-top:10px"><button class="btn secondary" id="dailyBackup">💾 備份全部資料</button><button class="btn secondary" id="dailyRestore">📥 匯入／還原備份</button></div>
<p class="note">建議定期按「立即備份全部資料」，把備份檔保存到 iPhone「檔案」或 iCloud。</p></div>
<div class="card"><h2>每日紀錄</h2><div id="records"></div></div>
</section>

<section id="monthly" class="hidden">
<div class="card"><h2>每月統計</h2><label>選擇月份<input id="monthPicker" type="month"></label>
<div class="row" style="margin-top:10px"><button class="btn secondary" id="monthBackup">💾 備份全部資料</button><button class="btn secondary" id="monthRestore">📥 匯入／還原備份</button></div></div>
<div class="card"><h2>該月地點統計</h2><div class="tablewrap"><table class="table" id="placeTable"></table></div></div>
<div class="card"><h2>本月總計</h2><div class="summary" id="monthSummary"></div></div>
</section>

<section id="yearly" class="hidden">
<div class="card"><h2>年度統計</h2><label>選擇年份<input id="yearPicker" type="number" min="2000" max="2100"></label>
<div class="row" style="margin-top:10px"><button class="btn secondary" id="yearBackup">💾 備份全部資料</button><button class="btn secondary" id="yearRestore">📥 匯入／還原備份</button></div></div>
<div class="card"><div class="summary" id="yearSummary"></div></div>
<div class="card"><h2>12 個月統計</h2><div class="tablewrap"><table class="table" id="yearTable"></table></div></div>
<div class="card"><p class="note">資料只儲存在這支手機的瀏覽器本機。若清除瀏覽器網站資料，資料可能會消失；建議定期使用下方備份功能。</p>
<div class="row"><button class="btn secondary" id="export">⬇️ 備份資料</button><button class="btn secondary" id="importBtn">⬆️ 還原資料</button><input id="file" type="file" accept=".json" class="hidden"></div></div>
</section>
</main>
<script>

function localDateStr(d=new Date()){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

const KEY="truck_daily_report_v1";
let data=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
const money=n=>Math.round(n||0).toLocaleString("zh-TW");
const num=n=>Number(n||0);
function saveData(){localStorage.setItem(KEY,JSON.stringify(data))}
function today(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}
function backupStamp(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`;
}
$("date").value=today(); $("monthPicker").value=today().slice(0,7); $("yearPicker").value=new Date().getFullYear();

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 ["daily","monthly","yearly"].forEach(x=>$(x).classList.toggle("hidden",x!==b.dataset.tab));
 renderAll();
});
function calc(arr){
 return {tons:arr.reduce((s,x)=>s+num(x.tons),0),trips:arr.reduce((s,x)=>s+num(x.tonTrips)+num(x.trips),0),
 amount:arr.reduce((s,x)=>s+num(x.amount),0),percentAmount:arr.reduce((s,x)=>s+num(x.percentAmount),0)};
}
function summaryHTML(c){
 return [["總噸數",c.tons.toFixed(2)+" 噸"],["總車趟",money(c.trips)+" 趟"],["運費總金額",money(c.amount)+" 元"],["％計算金額",money(c.percentAmount)+" 元"]]
 .map(([a,b])=>`<div class="metric"><span>${a}</span><b>${b}</b></div>`).join("");
}
function monthSummaryHTML(c){
 return [["總噸數",c.tons.toFixed(2)+" 噸"],["總車趟",money(c.trips)+" 趟"],["總金額",money(c.amount)+" 元"],["總％計算金額",money(c.percentAmount)+" 元"]]
 .map(([a,b])=>`<div class="metric"><span>${a}</span><b>${b}</b></div>`).join("");
}
$("save").onclick=()=>{
 const date=$("date").value, place=$("place").value.trim(), tons=num($("tons").value), tonTrips=num($("tonTrips").value), trips=num($("trips").value), unitPrice=num($("unitPrice").value), tripPrice=num($("tripPrice").value), expenseItem=$("expenseItem").value.trim(), expense=num($("expense").value), incomeItem=$("incomeItem").value.trim(), manualIncome=num($("manualIncome").value), amountPercent=num($("amountPercent").value), amount=unitPrice*tons+tripPrice*trips, percentAmount=amount*amountPercent/100;
 if(!date||!place){alert("請至少填寫日期與地點");return}
 if(trips<0||tonTrips<0||tons<0||unitPrice<0||tripPrice<0||expense<0||manualIncome<0||amountPercent<0){alert("數字不能小於 0");return}
 data.push({id:Date.now(),date,place,tons,tonTrips,trips,unitPrice,tripPrice,amount,amountPercent,percentAmount,expenseItem,expense,incomeItem,manualIncome});
 data.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);saveData();
 $("place").value="";$("tons").value="";$("tonTrips").value=0;$("unitPrice").value="";$("tripPrice").value="";$("amountPercent").value="";$("expenseItem").value="";$("expense").value="";$("incomeItem").value="";$("manualIncome").value="";
 renderAll();
};
$("clear").onclick=()=>{["place","tons","unitPrice","tripPrice","amountPercent","expenseItem","expense","incomeItem","manualIncome"].forEach(x=>$(x).value="");$("date").value=today();$("tonTrips").value=0;$("trips").value=1};

function renderDaily(){
 const d=$("date").value||today(), arr=data.filter(x=>x.date===d), c=calc(arr);
 $("dailyTitle").textContent=d+" 統計";$("dailySummary").innerHTML=summaryHTML(c);
 if(!arr.length){$("records").innerHTML='<div class="empty">這天還沒有紀錄</div>';return}
 $("records").innerHTML=arr.map(x=>`<div class="item">
 <div class="itemtop"><b>${esc(x.place)}</b><div class="row" style="flex:0 0 auto"><button class="btn secondary" onclick="edit(${x.id})">修改</button><button class="btn danger" onclick="del(${x.id})">刪除</button></div></div>
 <div class="muted">噸數 ${x.tons.toFixed(2)} 噸　噸車趟 ${num(x.tonTrips)}　每噸單價 ${money(x.unitPrice ?? 0)} 元／噸　每車趟 ${x.trips}　每車趟單價 ${money(x.tripPrice ?? 0)} 元／趟　運費總金額 ${money(x.amount)} 元　${num(x.amountPercent)}%＝${money(x.percentAmount)} 元</div>
 <div class="muted">支出：${esc(x.expenseItem||"未填項目")}　${money(x.expense)} 元</div>
 <div class="muted">收入：${esc(x.incomeItem||"未填項目")}　${money(x.manualIncome)} 元</div></div>`).join("");
}
function del(id){if(confirm("確定刪除這筆紀錄？")){data=data.filter(x=>x.id!==id);saveData();renderAll()}}
function edit(id){
 const x=data.find(v=>v.id===id); if(!x)return;
 $("date").value=x.date;$("place").value=x.place;$("tons").value=x.tons;$("tonTrips").value=x.tonTrips ?? 0;$("trips").value=x.trips;$("unitPrice").value=x.unitPrice ?? 0;$("tripPrice").value=x.tripPrice ?? 0;$("amountPercent").value=x.amountPercent ?? "";$("expenseItem").value=x.expenseItem ?? "";$("expense").value=x.expense ?? 0;$("incomeItem").value=x.incomeItem ?? "";$("manualIncome").value=x.manualIncome ?? "";
 data=data.filter(v=>v.id!==id);saveData();renderAll();window.scrollTo({top:0,behavior:"smooth"});
}
function shiftDate(days){
 const d=new Date(($("date").value||today())+"T12:00:00");d.setDate(d.getDate()+days);
 $("date").value=localDateStr(d);renderDaily();
}
$("prevDay").onclick=()=>shiftDate(-1);$("nextDay").onclick=()=>shiftDate(1);
$("todayBtn").onclick=()=>{$("date").value=today();renderDaily()};
function renderMonth(){
 const m=$("monthPicker").value, arr=data.filter(x=>x.date.startsWith(m)), c=calc(arr);$("monthSummary").innerHTML=monthSummaryHTML(c);
 const map={};arr.forEach(x=>{map[x.place]??=[];map[x.place].push(x)});
 let rows=Object.entries(map).sort((a,b)=>b[1].reduce((s,x)=>s+x.amount,0)-a[1].reduce((s,x)=>s+x.amount,0)).map(([p,a])=>{let c=calc(a);return `<tr><td>${esc(p)}</td><td>${c.tons.toFixed(2)}</td><td>${c.trips}</td><td>${money(c.amount)}</td><td>${money(c.percentAmount)}</td><td>${a.map(x=>`${esc(x.expenseItem||"未填項目")} ${money(x.expense)}元`).join("<br>")}</td><td>${a.map(x=>`${esc(x.incomeItem||"未填項目")} ${money(x.manualIncome)}元`).join("<br>")}</td></tr>`}).join("");
 $("placeTable").innerHTML=`<tr><th>地點</th><th>噸數</th><th>總車趟</th><th>金額</th><th>％計算金額</th><th>支出項目／金額</th><th>收入項目／金額</th></tr>${rows||'<tr><td colspan="7" class="empty">本月沒有資料</td></tr>'}`;
}
function renderYear(){
 const y=String($("yearPicker").value), arr=data.filter(x=>x.date.startsWith(y+"-")), c=calc(arr);$("yearSummary").innerHTML=summaryHTML(c);
 let rows="";for(let i=1;i<=12;i++){let m=`${y}-${String(i).padStart(2,"0")}`,a=data.filter(x=>x.date.startsWith(m)),z=calc(a);rows+=`<tr><td>${i}月</td><td>${z.tons.toFixed(2)}</td><td>${z.trips}</td><td>${money(z.amount)}</td><td>${money(z.percentAmount)}</td><td>${a.map(x=>`${esc(x.expenseItem||"未填項目")} ${money(x.expense)}元`).join("<br>")}</td><td>${a.map(x=>`${esc(x.incomeItem||"未填項目")} ${money(x.manualIncome)}元`).join("<br>")}</td></tr>`}
 $("yearTable").innerHTML=`<tr><th>月份</th><th>噸數</th><th>車趟</th><th>金額</th><th>％計算金額</th><th>支出項目／金額</th><th>收入項目／金額</th></tr>${rows}<tr><th>全年</th><th>${c.tons.toFixed(2)}</th><th>${c.trips}</th><th>${money(c.amount)}</th><th>${money(c.percentAmount)}</th><th>${arr.map(x=>`${esc(x.expenseItem||"未填項目")} ${money(x.expense)}元`).join("<br>")}</th><th>${arr.map(x=>`${esc(x.incomeItem||"未填項目")} ${money(x.manualIncome)}元`).join("<br>")}</th></tr>`;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function renderAll(){renderDaily();renderMonth();renderYear()}
$("date").onchange=renderDaily;$("monthPicker").onchange=renderMonth;$("yearPicker").onchange=renderYear;

function backupInfo(){
 if(!data.length) return "本次備份共 0 筆資料。";
 const dates=data.map(x=>x.date).filter(Boolean).sort();
 return `本次共備份 ${data.length} 筆資料。\n資料日期：${dates[0]} ～ ${dates[dates.length-1]}`;
}
$("dailyBackup").onclick=()=>{
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download=`車趟日報備份_${backupStamp()}.json`;a.click();URL.revokeObjectURL(a.href);
 alert(backupInfo()+"\n\n備份檔已產生，請將檔案保存到「檔案」App 或 iCloud。");
};
function backupAll(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download=`車趟日報備份_${backupStamp()}.json`;a.click();URL.revokeObjectURL(a.href);
 alert(backupInfo()+"\n\n備份檔已產生，請將檔案保存到「檔案」App 或 iCloud。");
}
if($("monthBackup")) $("monthBackup").onclick=backupAll;
if($("yearBackup")) $("yearBackup").onclick=backupAll;
$("export").onclick=()=>{
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download=`車趟日報備份_${backupStamp()}.json`;a.click();URL.revokeObjectURL(a.href);
};
function openRestore(){ $("file").click(); }
$("importBtn").onclick=openRestore;
$("dailyRestore").onclick=openRestore;
$("monthRestore").onclick=openRestore;
$("yearRestore").onclick=openRestore;
$("file").onchange=e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const x=JSON.parse(r.result);
      if(!Array.isArray(x)) throw new Error("格式錯誤");
      const ok=confirm(`確定要還原這份備份嗎？\n\n備份內有 ${x.length} 筆資料。\n還原後，目前資料會被這份備份取代。\n\n不確定請按「取消」。`);
      if(ok){
        data=x;
        saveData();
        renderAll();
        alert("✅ 備份已成功還原");
      }
    }catch(err){
      alert("無法讀取這份備份檔，請選擇車趟日報的 .json 備份。");
    }
    e.target.value="";
  };
  r.readAsText(f);
};
renderAll();
</script>
</body>
</html>
